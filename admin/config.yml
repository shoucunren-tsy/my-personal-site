backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "profile"
    label: "个人信息"
    folder: "data"
    create: false
    extension: json
    format: json
    slug: "profile"
    editor:
      preview: false
    fields:
      - { label: "头像", name: "avatar", widget: "image", default: "/images/avatar.jpg" }
      - { label: "微信二维码", name: "wechat_qr", widget: "image", default: "/images/wechat_qr.png" }
      - { label: "昵称", name: "nickname", widget: "string", default: "创意大学生" }
      - { label: "标语", name: "tagline", widget: "string", default: "把每个想法变成奖杯" }
      - { label: "自我介绍", name: "bio", widget: "text", default: "我喜欢创造有趣的东西。" }
      - { label: "手机号码", name: "phone", widget: "string", default: "13800000000" }
      - { label: "简历文件", name: "resume_url", widget: "file", required: false }

  - name: "awards"
    label: "获奖列表"
    folder: "data"
    create: false
    extension: json
    format: json
    slug: "awards"
    fields:
      - label: "奖项列表"
        name: "root"
        widget: "list"
        summary: "{{fields.name}}"
        fields:  # 👈 这里修复了！原来是 field
          - { label: "奖项名称", name: "name", widget: "string" }
          - { label: "年份", name: "year", widget: "string", default: "2025" }
          - { label: "奖项等级", name: "level", widget: "string", default: "一等奖" }
        default:
          - { name: "全国大学生创意营销大赛金奖", year: "2025", level: "国家级金奖" }
          - { name: "互联网+创新创业大赛省一等奖", year: "2024", level: "省级一等奖" }

  - name: "skills"
    label: "技能标签"
    folder: "data"
    create: false
    extension: json
    format: json
    slug: "skills"
    fields:
      - label: "技能列表"
        name: "root"
        widget: "list"
        field: { label: "技能", name: "skill", widget: "string" }
        default: ["创意策划", "Python / AI", "演讲表达", "UI 设计", "团队领导"]
